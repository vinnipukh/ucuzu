[project]
name = "inflation-study-dashboard"
version = "0.1.0"
description = "Svelte frontend and Falcon/SQLite API for the Inflation Study project"
requires-python = ">=3.14"
dependencies = [
    "falcon",
    "gunicorn>=26.2.0",
    "granian>=2.8.2",
    "httpx>=0.28",
    "numpy>=2.0",
    "orjson>=3.12.0",
    "pandas>=2.0",
    "requests>=2.32.0",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
