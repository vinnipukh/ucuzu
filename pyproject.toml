[project]
name = "inflation-study-dashboard"
version = "0.1.0"
description = "Svelte frontend and Falcon/SQLite API for the Inflation Study project"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "falcon",
    "gunicorn>=26.2.0",
    "granian>=2.8.2",
    "httpx>=0.28",
    "numpy>=2.0",
    "orjson>=3.12.0",
    "pandas>=2.0",
    "redis>=8.1.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.52.3",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.37.1",
]
